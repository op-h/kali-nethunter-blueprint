<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="880" height="330" rx="14" fill="#0B1020"/>
  <text x="440" y="40" text-anchor="middle" fill="#E6EDF3" font-size="22" font-weight="700">End-to-end pipeline</text>

  <!-- row of steps -->
  <g>
    <rect x="30"  y="78" width="150" height="86" rx="10" fill="#141C33" stroke="#1793D1"/>
    <text x="105" y="108" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">1 · Pull</text>
    <text x="105" y="128" text-anchor="middle" fill="#8B97A7" font-size="11">/proc/config.gz</text>
    <text x="105" y="145" text-anchor="middle" fill="#8B97A7" font-size="11">backup boot.img</text>

    <rect x="212" y="78" width="150" height="86" rx="10" fill="#141C33" stroke="#263150"/>
    <text x="287" y="108" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">2 · Build</text>
    <text x="287" y="128" text-anchor="middle" fill="#8B97A7" font-size="11">clang + GNU as</text>
    <text x="287" y="145" text-anchor="middle" fill="#8B97A7" font-size="11">patches + configs</text>

    <rect x="394" y="78" width="150" height="86" rx="10" fill="#141C33" stroke="#263150"/>
    <text x="469" y="108" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">3 · Repack</text>
    <text x="469" y="128" text-anchor="middle" fill="#8B97A7" font-size="11">raw Image → boot</text>
    <text x="469" y="145" text-anchor="middle" fill="#8B97A7" font-size="11">keep ramdisk+DTBH</text>

    <rect x="576" y="78" width="150" height="86" rx="10" fill="#141C33" stroke="#263150"/>
    <text x="651" y="108" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">4 · Flash</text>
    <text x="651" y="128" text-anchor="middle" fill="#8B97A7" font-size="11">dd to boot (root)</text>
    <text x="651" y="145" text-anchor="middle" fill="#8B97A7" font-size="11">verify sha256</text>

    <rect x="740" y="78" width="110" height="86" rx="10" fill="#101A14" stroke="#1E7D4F"/>
    <text x="795" y="108" text-anchor="middle" fill="#58C98A" font-size="13" font-weight="700">5 · Boot</text>
    <text x="795" y="128" text-anchor="middle" fill="#8B97A7" font-size="11">verify live</text>
    <text x="795" y="145" text-anchor="middle" fill="#8B97A7" font-size="11">kernel feats</text>
  </g>
  <g stroke="#6B7A90" stroke-width="2" marker-end="url(#a)">
    <path d="M180 121 L210 121"/><path d="M362 121 L392 121"/>
    <path d="M544 121 L574 121"/><path d="M726 121 L738 121"/>
  </g>

  <!-- second row: userland -->
  <rect x="30" y="206" width="400" height="92" rx="10" fill="#141C33" stroke="#1793D1"/>
  <text x="50" y="230" fill="#8B97A7" font-size="12" font-weight="600">6 · ENHANCE SHELL</text>
  <text x="50" y="254" fill="#E6EDF3" font-size="12">zsh + Kali prompt + autosuggestions + nh/tools menu</text>
  <text x="50" y="275" fill="#8B97A7" font-size="11">shell/setup-kali-shell.sh  ·  nhterm-fix/fix-nhterm-kali.sh</text>

  <rect x="450" y="206" width="400" height="92" rx="10" fill="#10233A" stroke="#1793D1"/>
  <text x="470" y="230" fill="#8B97A7" font-size="12" font-weight="600">7 · LAUNCHER APP</text>
  <text x="470" y="254" fill="#E6EDF3" font-size="12">build + sign APK (no Gradle) → one-tap Kali terminal</text>
  <text x="470" y="275" fill="#8B97A7" font-size="11">terminal-app/build-apk.ps1  ·  com.oph.nethunter</text>

  <path d="M795 164 L795 190 L650 190" stroke="#6B7A90" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B7A90"/></marker></defs>
</svg>
