<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#6B7A90"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1E7D4F"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="14" fill="#0B1020"/>
  <text x="450" y="40" text-anchor="middle" fill="#E6EDF3" font-size="22" font-weight="700">End-to-end pipeline</text>

  <!-- ===== TOP ROW: kernel (compile) ===== -->
  <text x="40" y="76" fill="#58C98A" font-size="12" font-weight="700">BUILD &amp; FLASH THE KERNEL</text>
  <rect x="40"  y="86" width="150" height="86" rx="10" fill="#141C33" stroke="#1793D1"/>
  <text x="115" y="116" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">1 · Pull</text>
  <text x="115" y="136" text-anchor="middle" fill="#8B97A7" font-size="11">/proc/config.gz</text>
  <text x="115" y="153" text-anchor="middle" fill="#8B97A7" font-size="11">backup boot.img</text>

  <rect x="212" y="86" width="150" height="86" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="287" y="116" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">2 · Build</text>
  <text x="287" y="136" text-anchor="middle" fill="#8B97A7" font-size="11">clang + GNU as</text>
  <text x="287" y="153" text-anchor="middle" fill="#8B97A7" font-size="11">patches + config</text>

  <rect x="384" y="86" width="150" height="86" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="459" y="116" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">3 · Repack</text>
  <text x="459" y="136" text-anchor="middle" fill="#8B97A7" font-size="11">raw Image → boot</text>
  <text x="459" y="153" text-anchor="middle" fill="#8B97A7" font-size="11">keep ramdisk+DTBH</text>

  <rect x="556" y="86" width="150" height="86" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="631" y="116" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">4 · Flash</text>
  <text x="631" y="136" text-anchor="middle" fill="#8B97A7" font-size="11">dd to boot (root)</text>
  <text x="631" y="153" text-anchor="middle" fill="#8B97A7" font-size="11">verify sha256</text>

  <rect x="728" y="86" width="132" height="86" rx="10" fill="#101A14" stroke="#1E7D4F"/>
  <text x="794" y="116" text-anchor="middle" fill="#58C98A" font-size="13" font-weight="700">5 · Boot</text>
  <text x="794" y="136" text-anchor="middle" fill="#8B97A7" font-size="11">verify live</text>
  <text x="794" y="153" text-anchor="middle" fill="#8B97A7" font-size="11">kernel feats</text>

  <g stroke="#6B7A90" stroke-width="2" marker-end="url(#a)">
    <path d="M190 129 L210 129"/><path d="M362 129 L382 129"/>
    <path d="M534 129 L554 129"/><path d="M706 129 L726 129"/>
  </g>

  <!-- elbow from 5·Boot down into second row -->
  <path d="M794 172 L794 208 L115 208 L115 244" stroke="#1E7D4F" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- ===== BOTTOM ROW: post-boot setup ===== -->
  <text x="40" y="236" fill="#1793D1" font-size="12" font-weight="700">THEN MAKE IT USABLE (no reflash)</text>
  <rect x="40"  y="244" width="194" height="104" rx="10" fill="#141C33" stroke="#1793D1"/>
  <text x="137" y="270" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">6 · Shell</text>
  <text x="137" y="291" text-anchor="middle" fill="#8B97A7" font-size="10.5">zsh · Kali prompt · nh/tools</text>
  <text x="137" y="309" text-anchor="middle" fill="#8B97A7" font-size="10.5">NeoTerm "Kali Shell" fix</text>
  <text x="137" y="331" text-anchor="middle" fill="#58C98A" font-size="10.5">+ Ctrl+C-safe session</text>

  <rect x="248" y="244" width="194" height="104" rx="10" fill="#10233A" stroke="#1793D1"/>
  <text x="345" y="270" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">7 · Launcher app</text>
  <text x="345" y="291" text-anchor="middle" fill="#8B97A7" font-size="10.5">build + sign APK (no Gradle)</text>
  <text x="345" y="309" text-anchor="middle" fill="#8B97A7" font-size="10.5">one-tap Kali terminal</text>
  <text x="345" y="331" text-anchor="middle" fill="#8B97A7" font-size="10.5">com.oph.nethunter</text>

  <rect x="456" y="244" width="194" height="104" rx="10" fill="#101A14" stroke="#1E7D4F"/>
  <text x="553" y="270" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">8 · USB Wi-Fi driver</text>
  <text x="553" y="291" text-anchor="middle" fill="#8B97A7" font-size="10.5">rtl88x2bu → Magisk module</text>
  <text x="553" y="309" text-anchor="middle" fill="#8B97A7" font-size="10.5">-fno-stack-protector fix</text>
  <text x="553" y="331" text-anchor="middle" fill="#58C98A" font-size="10.5">wlan1 · monitor + inject</text>

  <rect x="664" y="244" width="196" height="104" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="762" y="270" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">9 · Theme</text>
  <text x="762" y="291" text-anchor="middle" fill="#8B97A7" font-size="10.5">Lawnchair + Arcticons</text>
  <text x="762" y="309" text-anchor="middle" fill="#8B97A7" font-size="10.5">black theme · wallpaper</text>
  <text x="762" y="331" text-anchor="middle" fill="#8B97A7" font-size="10.5">debloat + privacy apps</text>

  <g stroke="#6B7A90" stroke-width="2" marker-end="url(#a)">
    <path d="M234 296 L246 296"/><path d="M442 296 L454 296"/><path d="M650 296 L662 296"/>
  </g>
</svg>
