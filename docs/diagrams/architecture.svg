<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#6B7A90"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1793D1"/>
    </marker>
  </defs>

  <rect width="920" height="640" rx="14" fill="#0B1020"/>
  <text x="460" y="40" text-anchor="middle" fill="#E6EDF3" font-size="23" font-weight="700">Kali NetHunter on a rooted phone — how the pieces fit</text>
  <text x="460" y="66" text-anchor="middle" fill="#8B97A7" font-size="13">Galaxy Note 9 (crownlte) · LineageOS 20 / Android 13 · Magisk · ★ = this blueprint builds or installs it</text>

  <!-- ===== APP LAYER ===== -->
  <rect x="40" y="88" width="840" height="108" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="60" y="110" fill="#8B97A7" font-size="12" font-weight="600">USER SPACE · APPS  (themed: Lawnchair launcher · Arcticons icons · black theme)</text>
  <rect x="60" y="122" width="244" height="60" rx="8" fill="#10233A" stroke="#1793D1"/>
  <text x="182" y="146" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">★ Kali NetHunter launcher</text>
  <text x="182" y="166" text-anchor="middle" fill="#8B97A7" font-size="11">com.oph.nethunter · one tap</text>
  <rect x="324" y="122" width="244" height="60" rx="8" fill="#141C33" stroke="#263150"/>
  <text x="446" y="146" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">NetHunter Terminal</text>
  <text x="446" y="166" text-anchor="middle" fill="#8B97A7" font-size="11">com.offsec.nhterm (NeoTerm)</text>
  <rect x="588" y="122" width="232" height="60" rx="8" fill="#141C33" stroke="#263150"/>
  <text x="704" y="146" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">NetHunter app + Store</text>
  <text x="704" y="166" text-anchor="middle" fill="#8B97A7" font-size="11">HID / KeX / chroot manager</text>

  <!-- ===== CHROOT LAYER ===== -->
  <rect x="40" y="214" width="840" height="108" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="60" y="236" fill="#8B97A7" font-size="12" font-weight="600">KALI CHROOT · /data/local/nhsystem/kali-arm64</text>
  <rect x="60" y="248" width="384" height="62" rx="8" fill="#10233A" stroke="#1793D1"/>
  <text x="252" y="272" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">★ Enhanced zsh  (OPH)</text>
  <text x="252" y="292" text-anchor="middle" fill="#8B97A7" font-size="11">Kali prompt · autosuggest · nh / tools · Ctrl+C-safe session</text>
  <rect x="464" y="248" width="356" height="62" rx="8" fill="#141C33" stroke="#263150"/>
  <text x="642" y="272" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="700">Kali tooling</text>
  <text x="642" y="292" text-anchor="middle" fill="#8B97A7" font-size="11">nmap · metasploit · aircrack-ng · wifite · sqlmap …</text>

  <!-- ===== ROOT + MAGISK MODULES ===== -->
  <rect x="40" y="340" width="840" height="112" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="60" y="362" fill="#8B97A7" font-size="12" font-weight="600">ROOT BROKER · MAGISK (systemless)</text>
  <rect x="60" y="374" width="384" height="30" rx="6" fill="#231018" stroke="#D81A3F"/>
  <text x="252" y="394" text-anchor="middle" fill="#F2C9D3" font-size="12.5" font-weight="700">Magisk su  ·  /debug_ramdisk/su  ·  grants root to apps + chroot</text>
  <rect x="464" y="374" width="356" height="30" rx="6" fill="#102A1C" stroke="#1E7D4F"/>
  <text x="642" y="394" text-anchor="middle" fill="#8FE3B4" font-size="12.5" font-weight="700">★ Magisk module: rtl88x2bu (.ko)  ·  insmod at boot</text>
  <rect x="60" y="412" width="760" height="30" rx="6" fill="#141C33" stroke="#263150"/>
  <text x="440" y="432" text-anchor="middle" fill="#8B97A7" font-size="11.5">modules load the out-of-tree USB Wi-Fi driver without re-flashing the kernel — plug-and-play adapter support</text>

  <!-- ===== KERNEL LAYER ===== -->
  <rect x="40" y="470" width="840" height="112" rx="10" fill="#101A14" stroke="#1E7D4F"/>
  <text x="60" y="492" fill="#58C98A" font-size="12" font-weight="700">★ CUSTOM NETHUNTER KERNEL · Linux 4.9  (the only part that must be compiled)</text>
  <rect x="60" y="502" width="250" height="68" rx="8" fill="#13241A" stroke="#1E7D4F"/>
  <text x="185" y="528" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">USB gadget</text>
  <text x="185" y="548" text-anchor="middle" fill="#8B97A7" font-size="11">f_hid (BadUSB) · mass-storage</text>
  <rect x="330" y="502" width="250" height="68" rx="8" fill="#13241A" stroke="#1E7D4F"/>
  <text x="455" y="528" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">mac80211 + cfg80211</text>
  <text x="455" y="548" text-anchor="middle" fill="#8B97A7" font-size="11">injection patch · for USB adapters</text>
  <rect x="600" y="502" width="220" height="68" rx="8" fill="#13241A" stroke="#1E7D4F"/>
  <text x="710" y="528" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">in-tree USB Wi-Fi</text>
  <text x="710" y="548" text-anchor="middle" fill="#8B97A7" font-size="11">ath9k_htc · rtl8xxxu · rt2800usb</text>

  <!-- ===== EXTERNAL HARDWARE ===== -->
  <rect x="300" y="604" width="320" height="26" rx="6" fill="#1A2238" stroke="#3A4766"/>
  <text x="460" y="622" text-anchor="middle" fill="#C7D1E0" font-size="11.5" font-weight="600">External RTL8812BU USB adapter → wlan1 (monitor + injection)</text>

  <!-- ===== CONNECTORS ===== -->
  <path d="M182 182 L182 214" stroke="#1793D1" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M446 182 L270 248" stroke="#3A4766" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M252 322 L252 340" stroke="#3A4766" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M642 322 L642 374" stroke="#1E7D4F" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M252 452 L252 470" stroke="#3A4766" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M642 452 L710 502" stroke="#1E7D4F" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M460 582 L460 604" stroke="#3A4766" stroke-width="2" marker-end="url(#arr)"/>
</svg>
