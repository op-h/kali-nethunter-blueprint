<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#58C98A"/>
    </marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#D81A3F"/>
    </marker>
  </defs>

  <rect width="900" height="500" rx="14" fill="#0B1020"/>
  <text x="450" y="38" text-anchor="middle" fill="#E6EDF3" font-size="22" font-weight="700">Boot image anatomy — the bootloop trap</text>
  <text x="450" y="62" text-anchor="middle" fill="#8B97A7" font-size="13">Swap ONLY the kernel. Keep the Magisk ramdisk and the DTBH device tree. Match the kernel format.</text>

  <!-- ===== RIGHT (correct rebuild) ===== -->
  <text x="235" y="104" text-anchor="middle" fill="#58C98A" font-size="12" font-weight="700">CORRECT rebuild — raw Image</text>
  <rect x="70" y="116" width="330" height="56" rx="7" fill="#101A14" stroke="#1E7D4F"/>
  <text x="235" y="140" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">kernel = RAW arm64 Image</text>
  <text x="235" y="159" text-anchor="middle" fill="#58C98A" font-size="11" font-family="monospace">magic 'ARMd' @0x38 · NOT gzip</text>
  <rect x="70" y="178" width="330" height="40" rx="7" fill="#141C33" stroke="#263150"/>
  <text x="235" y="203" text-anchor="middle" fill="#E6EDF3" font-size="12">ramdisk  (Magisk — keep for root)</text>
  <rect x="70" y="224" width="330" height="40" rx="7" fill="#10233A" stroke="#1793D1"/>
  <text x="235" y="249" text-anchor="middle" fill="#E6EDF3" font-size="12">extra = DTBH device-tree container</text>
  <path d="M235 266 L235 300" stroke="#58C98A" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="235" y="322" text-anchor="middle" fill="#58C98A" font-size="13" font-weight="700">✓ boots the NetHunter kernel</text>

  <!-- ===== WRONG rebuild ===== -->
  <text x="665" y="104" text-anchor="middle" fill="#F2A3B4" font-size="12" font-weight="700">WRONG rebuild — gzip</text>
  <rect x="500" y="116" width="330" height="56" rx="7" fill="#231018" stroke="#D81A3F"/>
  <text x="665" y="140" text-anchor="middle" fill="#F2C9D3" font-size="13" font-weight="700">kernel = Image.gz-dtb (gzip)</text>
  <text x="665" y="159" text-anchor="middle" fill="#F2A3B4" font-size="11" font-family="monospace">loader jumps into gzip bytes → crash</text>
  <rect x="500" y="178" width="330" height="40" rx="7" fill="#141C33" stroke="#263150"/>
  <text x="665" y="203" text-anchor="middle" fill="#E6EDF3" font-size="12">ramdisk</text>
  <rect x="500" y="224" width="330" height="40" rx="7" fill="#141C33" stroke="#263150"/>
  <text x="665" y="249" text-anchor="middle" fill="#E6EDF3" font-size="12">extra (DTBH)</text>
  <path d="M665 266 L665 300" stroke="#D81A3F" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="665" y="322" text-anchor="middle" fill="#F2A3B4" font-size="13" font-weight="700">✗ stuck on the Samsung logo</text>

  <!-- divider -->
  <line x1="450" y1="112" x2="450" y2="326" stroke="#263150" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ===== HOW TO CHECK ===== -->
  <rect x="70" y="356" width="760" height="112" rx="10" fill="#141C33" stroke="#263150"/>
  <text x="90" y="380" fill="#8B97A7" font-size="12" font-weight="600">HOW TO CHECK YOUR DEVICE'S FORMAT BEFORE FLASHING</text>
  <text x="90" y="407" fill="#E6EDF3" font-size="12.5" font-family="monospace">$ magiskboot unpack boot.img</text>
  <text x="90" y="431" fill="#E6EDF3" font-size="12.5" font-family="monospace">$ xxd -s 0x38 -l 4 kernel</text>
  <text x="90" y="455" fill="#8B97A7" font-size="12" font-family="monospace">41524d64  →  'ARMd' = RAW Image    |    1f8b08xx  →  gzip (Image.gz-dtb)</text>
</svg>
